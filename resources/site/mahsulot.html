<body>

<template id="dc-template">

<div style="font-family: Archivo, sans-serif; color: #111418; position: relative; z-index: 0; --acc: {{accent}}">

</nav>
<div class="mono" style="display: flex; align-items: center; gap: 16px; font-size: 14px">
<a href="#" style="font-weight: 600">UZ</a><a href="#" style="color: #5B636D">RU</a>

</div>

<section style="padding: 40px 0 72px">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111418">
<div style="display: flex">

</sc-for>
</div>

</div>

<sc-if value="{{isDraw}}" hint-placeholder-val="{{ true }}">
<svg role="img" aria-label="{{drawLabel}}" viewBox="0 0 640 380" width="100%" style="display: block; background-image: linear-gradient(#EEF0F2 1px, transparent 1px), linear-gradient(90deg, #EEF0F2 1px, transparent 1px); background-size: 20px 20px">
<g stroke="#111418" fill="none" stroke-width="1">
<line x1="40" y1="{{dw.cy}}" x2="600" y2="{{dw.cy}}" stroke-dasharray="14 4 2 4"/>
</g>
<rect class="dim" x="{{dw.shx1}}" y="{{dw.shy}}" width="{{dw.shw}}" height="{{dw.shh}}" fill="#4A535E" stroke="#111418" stroke-width="1.5"/>

<g stroke="#111418" stroke-width="1" fill="none">
<line class="dim" x1="{{dw.x}}" y1="{{dw.ldy}}" x2="{{dw.x2}}" y2="{{dw.ldy}}"/>
<line class="dim" x1="{{dw.x}}" y1="{{dw.ldy1}}" x2="{{dw.x}}" y2="{{dw.ldy2}}"/>
<line class="dim" x1="{{dw.x2}}" y1="{{dw.ldy1}}" x2="{{dw.x2}}" y2="{{dw.ldy2}}"/>
<line class="dim" x1="{{dw.ddx}}" y1="{{dw.y}}" x2="{{dw.ddx}}" y2="{{dw.y2}}"/>
<line class="dim" x1="{{dw.ddx1}}" y1="{{dw.y}}" x2="{{dw.ddx2}}" y2="{{dw.y}}"/>

</g>
<g font-family="JetBrains Mono, monospace" font-size="11" fill="#5B636D">
<text x="24" y="360">IR-V01 · POLIURETAN VALIK · O'LCHAMLAR MM</text>
<text x="616" y="360" text-anchor="end">INTER ROLL</text>
</g>
</svg>
</sc-if>

<sc-if value="{{is3d}}" hint-placeholder-val="{{ false }}">

</div>
</sc-if>

<div class="mono" style="border-top: 1px solid #111418; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 12px; text-transform: uppercase">
<div style="padding: 14px 16px; border-right: 1px solid #DDE1E5"><div style="color: #5B636D">Diametr</div><div style="font: 800 22px Archivo, sans-serif; margin-top: 4px">Ø{{D}}</div></div>
<div style="padding: 14px 16px; border-right: 1px solid #DDE1E5"><div style="color: #5B636D">Uzunlik</div><div style="font: 800 22px Archivo, sans-serif; margin-top: 4px">{{L}}</div></div>
<div style="padding: 14px 16px; border-right: 1px solid #DDE1E5"><div style="color: #5B636D">Qoplama</div><div style="font: 800 22px Archivo, sans-serif; margin-top: 4px">{{T}} mm</div></div>
<div style="padding: 14px 16px"><div style="color: #5B636D">Qattiqlik</div><div style="font: 800 22px Archivo, sans-serif; margin-top: 4px">{{shore}} A</div></div>
</div>

<p style="margin: 0; color: #3E4650; font-size: 17px; line-height: 1.6">Metall o'zak ustiga quyilgan poliuretan qoplamali valik. Ishqalanish, yog' va yuklamaga chidamli. Konveyer, press, prokat va poligrafiya liniyalari uchun buyurtma o'lchamida tayyorlanadi.</p>

<div class="in" style="background: #fff; border: 1px solid #111418; display: flex; flex-direction: column; animation-delay: 240ms">

<div style="padding: 20px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #DDE1E5">
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Material</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #111418">

<button onClick="{{mt.pick}}" style="{{mt.style}}">{{mt.label}}</button>
</sc-for>
</div>
</div>

<div style="padding: 20px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #DDE1E5">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Qattiqlik, Shore A</span><span style="font-weight: 800; font-size: 20px">{{shore}} A</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid #111418">
<sc-for list="{{shores}}" as="s" hint-placeholder-count="5">
<button onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>

</div>
<div class="mono" style="display: flex; justify-content: space-between; font-size: 11px; color: #5B636D; text-transform: uppercase"><span>Yumshoq · ushlash</span><span>{{shoreHint}}</span><span>Qattiq · yuklama</span></div>
</div>

<div style="padding: 20px; display: flex; flex-direction: column; gap: 18px; border-bottom: 1px solid #DDE1E5">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between"><span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Diametr Ø</span><b>{{D}} mm</b></span>
<input type="range" min="40" max="400" step="5" value="{{D}}" onChange="{{setD}}">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between"><span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Ishchi uzunlik L</span><b>{{L}} mm</b></span>
<input type="range" min="100" max="2000" step="10" value="{{L}}" onChange="{{setL}}">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between"><span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Qoplama qalinligi</span><b>{{T}} mm</b></span>
<input type="range" min="5" max="{{Tmax}}" step="1" value="{{T}}" onChange="{{setT}}">
</label>
</div>

<div style="display: flex; align-items: center; border: 1px solid #111418">

<span style="min-width: 72px; text-align: center; font-weight: 800; font-size: 18px">{{qty}} dona</span>

</div>
<span class="mono" style="font-size: 13px; font-weight: 600; text-transform: uppercase">Narx — so'rov bo'yicha</span>
</div>
<a href="#sorov" class="btn" style="margin: 0 20px 20px; background: #111418; color: #fff; border: 1px solid #111418; padding: 18px; font-weight: 700; text-align: center">Shu o'lcham bilan so'rov yuborish →</a>
</div>

<div class="mono in" style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; animation-delay: 320ms">

<a href="#" class="btn" style="border: 1px solid #111418; background: #fff; padding: 12px 16px">Katalog (PDF)</a>
</div>
</div>
</div>
</div>
</section>
