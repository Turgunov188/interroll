<div id="app"></div>
<template id="dc-template">

<div style="font-family: Archivo, sans-serif; color: #111418; position: relative; z-index: 0; --acc: {{accent}}">
<canvas data-mesh="1" aria-hidden="true" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: block"></canvas>

<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="/tr" style="display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#111418" stroke-width="2.5"><circle cx="17" cy="17" r="14"/><circle cx="17" cy="17" r="6"/><line x1="17" y1="3" x2="17" y2="11"/></svg><span style="font-weight: 800; font-size: 20px; letter-spacing: 0.03em">INTER ROLL</span></a>
<nav aria-label="Ana menü" class="mono" style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 14px; text-transform: uppercase"><a href="/tr/katalog">Ürünler</a><a href="/tr/qayta-qoplash">Yeniden kaplama</a><a href="/tr/zavod">Fabrika</a><a href="/tr/aloqa">İletişim</a></nav><span class="mono" style="display: flex; gap: 12px; font-size: 14px"><a href="/uz/kuzatish" hreflang="uz" lang="uz" style="color: #5B636D">UZ</a><a href="/kuzatish" hreflang="ru" lang="ru" style="color: #5B636D">RU</a><a href="/en/kuzatish" hreflang="en" lang="en" style="color: #5B636D">EN</a><a href="/tr/kuzatish" hreflang="tr" lang="tr" style="font-weight: 600; border-bottom: 2px solid {{accent}}">TR</a></span>
<a href="/tr/kuzatish" class="mono" style="font-size: 14px; text-transform: uppercase; border-bottom: 2px solid {{accent}}">Sipariş takibi</a>
</div>
</header>

<section style="padding: 56px 0 40px">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-end">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 14px">
<div class="mono" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em">[ Sipariş durumu ]</div>
<h1 style="margin: 0; font-weight: 800; font-size: 64px; line-height: 0.95; letter-spacing: -0.03em">Parçanız <span style="background: {{accent}}; padding: 0 8px">hangi atölyede?</span></h1>
<p style="margin: 0; color: #3E4650; font-size: 17px; line-height: 1.6">Talep numarasını ve telefonunuzun son 4 hanesini girin — siparişin hangi aşamada olduğunu gerçek zamanlı görün.</p>
</div>
<form onSubmit="{{find}}" style="{{formStyle}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px">Talep numarası<input type="text" value="{{code}}" onChange="{{setCode}}" placeholder="IR-0000"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px">Telefonun son 4 hanesi<input type="text" value="{{pin}}" onChange="{{setPin}}" placeholder="____" maxlength="4"></label>
<button type="submit" class="btn" style="background: #111418; color: #fff; border: 1px solid #111418; padding: 18px; font: 700 16px Archivo, sans-serif; cursor: pointer">Durumu gör →</button>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><span class="mono" role="alert" style="font-size: 12px; color: #9B3A1E">Böyle bir talep bulunamadı. Numarayı kontrol edin veya satış departmanını arayın.</span></sc-if>
<span class="mono" style="font-size: 11px; color: #5B636D">Örnek için: <button type="button" onClick="{{demo1}}" style="border: 0; background: none; text-decoration: underline; font: 600 11px 'JetBrains Mono', monospace; cursor: pointer; padding: 0">IR-1042 / 1111</button> · <button type="button" onClick="{{demo2}}" style="border: 0; background: none; text-decoration: underline; font: 600 11px 'JetBrains Mono', monospace; cursor: pointer; padding: 0">IR-1030 / 4444</button></span>
</form>
</div>
</section>

<sc-if value="{{found}}" hint-placeholder-val="{{ true }}">
<section class="pop" style="padding: 0 0 96px">

<div style="flex: 1 1 220px; padding: 24px; display: flex; flex-direction: column; gap: 6px; background: {{o.etaBg}}"><span class="mono" style="font-size: 12px; text-transform: uppercase">{{o.etaLabel}}</span><b style="font-size: 26px">{{o.eta}}</b><span class="mono" style="font-size: 12px">{{o.etaSub}}</span></div>
</div>

<div style="background: #fff; border: 1px solid #111418; padding: 28px; display: flex; flex-direction: column; gap: 24px">
<div style="position: relative; height: 6px; background: #E3E7EB"><span class="fill" style="position: absolute; left: 0; top: 0; bottom: 0; background: #111418; width: {{o.pct}}%"></span></div>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="6">
<li style="display: flex; flex-direction: column; gap: 8px; padding-right: 12px">
<span class="{{s.cls}}" style="{{s.dot}}">{{s.mark}}</span>
<b style="font-size: 15px; line-height: 1.2">{{s.t}}</b>
<span class="mono" style="font-size: 11px; color: #5B636D">{{s.d}}</span>
</li>
</sc-for>
</ol>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
<div style="flex: 2 1 520px; background: #fff; border: 1px solid #111418; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<b style="font-size: 20px">Geçmiş</b>
<sc-for list="{{log}}" as="l" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; align-items: flex-start; border-bottom: 1px solid #E3E7EB; padding-bottom: 12px"><span class="mono" style="font-size: 12px; color: #5B636D; min-width: 96px">{{l.d}}</span><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px">{{l.t}}</b><span style="font-size: 14px; color: #3E4650">{{l.n}}</span></span></div>
</sc-for>
</div>
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px">
<div style="background: #111418; color: #EEF0F2; border: 1px solid #111418; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: {{accent}}">Sorumlu yetkili</span>
<b style="font-size: 20px">[A. Yetkili]</b>
<a href="tel:+998000000000" class="mono" style="color: #fff; font-size: 14px">+998 [__] ___-__-__</a>
<a href="#" class="btn" style="background: {{accent}}; color: #111418; border: 1px solid #111418; padding: 14px; font-weight: 700; text-align: center">Telegram'dan bildirim al</a>
</div>
<div style="background: #fff; border: 1px solid #111418; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Belgeler</span>
<sc-for list="{{docs}}" as="d" hint-placeholder-count="3"><span style="{{d.style}}"><span>{{d.t}}</span><span class="mono" style="font-size: 12px">{{d.s}}</span></span></sc-for>
</div>
</div>
</div>
</div>
</section>
</sc-if>

<footer style="background: #111418; color: #A9B0B8; padding: 40px 0">
<div class="mono" style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; font-size: 13px"><span style="color: #fff; font-weight: 600">INTER ROLL</span><span style="display: flex; flex-wrap: wrap; gap: 18px"><a href="/tr/ishlar" style="color: #A9B0B8; text-decoration: none">Projeler</a><a href="/tr/video" style="color: #A9B0B8; text-decoration: none">Video</a><a href="/tr/blog" style="color: #A9B0B8; text-decoration: none">Blog</a><a href="/tr/tanlash-ustasi" style="color: #A9B0B8; text-decoration: none">Seçim sihirbazı</a><a href="/tr/kuzatish" style="color: #A9B0B8; text-decoration: none">Sipariş takibi</a></span><span>© 2026 Inter Roll LLC</span></div>
</footer>
</div>
