<div style="flex: 1 1 200px; background: #fff; border: 1px solid #111418; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Hardness</span><b style="font-size: 40px; line-height: 1">{{rec.shore}}</b><span style="font-size: 14px; color: #3E4650">Shore A</span></div>

<div class="mono" style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; font-size: 13px"><span style="color: #fff; font-weight: 600">INTER ROLL</span><span style="display: flex; flex-wrap: wrap; gap: 18px"><a href="/en/ishlar" style="color: #A9B0B8; text-decoration: none">Projects</a><a href="/en/video" style="color: #A9B0B8; text-decoration: none">Video</a><a href="/en/blog" style="color: #A9B0B8; text-decoration: none">Blog</a><a href="/en/tanlash-ustasi" style="color: #A9B0B8; text-decoration: none">Selection wizard</a><a href="/en/kuzatish" style="color: #A9B0B8; text-decoration: none">Order tracking</a></span><span>© 2026 Inter Roll LLC</span></div>
