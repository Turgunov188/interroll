<style>
body{margin:0;background:#EEF0F2}
a{color:#111418;text-decoration:none}a:hover{color:#111418}
.mono{font-family:'JetBrains Mono',monospace}
.ph{background:repeating-linear-gradient(135deg,#E3E7EB 0 12px,#DCE0E4 12px 24px)}
@keyframes irA{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes irB{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes irIn{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.in{animation:irIn .9s cubic-bezier(.2,.7,.2,1) both}
.card{transition:transform .3s ease,box-shadow .3s ease}
.card:hover{transform:translate(-6px,-6px);box-shadow:6px 6px 0 #111418}
.card:hover .ico{transform:rotate(-8deg) scale(1.08)}
.ico{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.btn{transition:transform .2s ease,box-shadow .2s ease}
.btn:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 #111418}
.chk{display:flex;gap:10px;align-items:center;min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#111418;margin:0}
input[type=search]{font:400 18px Archivo,sans-serif;border:1px solid #111418;background:#fff;padding:18px 18px 18px 52px;color:#111418;width:100%;box-sizing:border-box;border-radius:0;transition:box-shadow .2s}
input[type=search]:focus{outline:none;box-shadow:5px 5px 0 #111418}
select{font:600 14px 'JetBrains Mono',monospace;border:1px solid #111418;background:#fff;padding:10px 12px;border-radius:0}
@media (prefers-reduced-motion: reduce){.in{animation:none}}
</style>

<body>
<div id="app"></div>
<template id="dc-template">

<div style="font-family: Archivo, sans-serif; color: #111418; position: relative; z-index: 0; --acc: {{accent}}">
<canvas data-mesh="1" aria-hidden="true" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: block"></canvas>

<header style="background: #fff; border-bottom: 1px solid #111418; position: sticky; top: 0; z-index: 40">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="/en" style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#111418" stroke-width="2.5" style="{{logoSpin}}"><circle cx="17" cy="17" r="14"/><circle cx="17" cy="17" r="6"/><line x1="17" y1="3" x2="17" y2="11"/></svg>
<span style="font-weight: 800; font-size: 20px; letter-spacing: 0.03em">INTER ROLL</span>
</a>
<nav aria-label="Main menu" class="mono" style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 14px; text-transform: uppercase">
<a href="/en/katalog" style="border-bottom: 2px solid {{accent}}; padding-bottom: 2px">Products</a><a href="/en/qayta-qoplash">Recoating</a><a href="/en/zavod">Factory</a><a href="/en/aloqa">Contact</a>
</nav>
<div class="mono" style="display: flex; align-items: center; gap: 16px; font-size: 14px">
<a href="/uz/katalog" hreflang="uz" lang="uz" style="color: #5B636D">UZ</a><a href="/katalog" hreflang="ru" lang="ru" style="color: #5B636D">RU</a><a href="/en/katalog" hreflang="en" lang="en" style="font-weight: 600; border-bottom: 2px solid {{accent}}">EN</a><a href="/tr/katalog" hreflang="tr" lang="tr" style="color: #5B636D">TR</a>
<a href="#chizma" class="btn" style="background: {{accent}}; padding: 13px 18px; font-weight: 600; text-transform: uppercase; border: 1px solid #111418">Send a drawing</a>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; bottom: -1px; height: 3px; background: #111418; width: {{progress}}%"></div>
</header>

<section style="border-bottom: 1px solid #111418; background: radial-gradient(ellipse at 70% 0%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 60%)">
<div style="max-width: 1280px; margin: 0 auto; padding: 56px 24px 48px; display: flex; flex-direction: column; gap: 28px">
<div class="mono in" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #3E4650"><a href="/en" style="color: #3E4650">Home</a> / Catalog</div>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<h1 class="in" style="margin: 0; font-weight: 800; font-size: 72px; line-height: 0.95; letter-spacing: -0.03em; animation-delay: 80ms">Products<br><span style="background: {{accent}}; padding: 0 8px">catalog</span></h1>
<div class="mono in" style="display: flex; gap: 32px; font-size: 13px; text-transform: uppercase; animation-delay: 200ms">
<div><div style="font: 800 40px Archivo, sans-serif">{{total}}</div>items</div>
<div><div style="font: 800 40px Archivo, sans-serif">7</div>categories</div>
<div><div style="font: 800 40px Archivo, sans-serif">[__]</div>days to ready</div>
</div>
</div>
<label class="in" style="position: relative; display: block; animation-delay: 300ms">
<span class="mono" style="position: absolute; left: 0; top: -26px; font-size: 12px; text-transform: uppercase">Search by SKU or name</span>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111418" stroke-width="2.2" style="position: absolute; left: 18px; top: 50%; margin-top: -11px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="E.g. IR-V01, roller, wheel...">
</label>
</div>
</section>

<section style="position: sticky; top: 72px; z-index: 30; background: #fff; border-bottom: 1px solid #111418">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 0; overflow-x: auto">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
<button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span class="mono" style="font-size: 12px; opacity: 0.7">{{t.n}}</span></button>
</sc-for>
</div>
</section>

<section style="padding: 48px 0 96px">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<aside aria-label="Filters" style="flex: 1 1 240px; max-width: 280px; background: #fff; border: 1px solid #111418; padding: 24px; display: flex; flex-direction: column; gap: 26px; position: sticky; top: 148px">
<div class="mono" style="font-size: 13px; text-transform: uppercase; display: flex; justify-content: space-between"><span>Filter</span><button onClick="{{reset}}" style="border: 0; background: none; font: 600 12px 'JetBrains Mono', monospace; text-decoration: underline; cursor: pointer; padding: 0">Reset</button></div>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px">
<legend class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D; margin-bottom: 10px">Material</legend>
<label class="chk"><input type="checkbox" checked="{{pu}}" onChange="{{togPu}}"> Polyurethane</label>
<label class="chk"><input type="checkbox" checked="{{rz}}" onChange="{{togRz}}"> Rubber (NBR, EPDM)</label>
</fieldset>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px">
<legend class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D; margin-bottom: 10px">Hardness, Shore A</legend>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #111418">
<sc-for list="{{shores}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
</fieldset>
<sc-if value="{{hasInds}}" hint-placeholder-val="{{ true }}"><fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px">
<legend class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D; margin-bottom: 10px">Industry</legend>
<sc-for list="{{inds}}" as="in" hint-placeholder-count="5"><label class="chk"><input type="checkbox" checked="{{in.on}}" onChange="{{in.toggle}}"> {{in.label}}</label></sc-for>
</fieldset></sc-if>
<div style="border-top: 1px dashed #111418; padding-top: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="font-weight: 700; font-size: 17px; line-height: 1.3">Need a different size?</div>
<a href="#chizma" class="btn mono" style="background: #111418; color: #fff; padding: 14px; text-align: center; font-size: 13px; text-transform: uppercase; font-weight: 600; border: 1px solid #111418">Send a drawing →</a>
<a href="/en/tanlash-ustasi" class="btn mono" style="background: {{accent}}; padding: 14px; text-align: center; font-size: 13px; text-transform: uppercase; font-weight: 600; border: 1px solid #111418">Selection wizard →</a>
</div>
</aside>

<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div class="mono" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; text-transform: uppercase">
<span>Found: <b>{{count}}</b> items</span>
<label style="display: flex; align-items: center; gap: 10px">Sort <select><option>Popular</option><option>By SKU</option><option>New</option></select></label>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="background: #fff; border: 1px dashed #111418; padding: 48px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
<div style="font-weight: 800; font-size: 28px">This part isn't in the catalog</div>
<p style="margin: 0; color: #3E4650">But we can make it — send a drawing or a photo of a sample.</p>
<a href="#chizma" class="btn" style="background: {{accent}}; border: 1px solid #111418; padding: 14px 22px; font-weight: 700">Send a drawing →</a>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="9">
<article class="card" style="{{p.anim}}">
<a href="{{p.url}}" class="ph" style="overflow: hidden; height: 190px; border-bottom: 1px solid #111418; position: relative; display: flex; align-items: center; justify-content: center">
<svg class="ico" aria-hidden="true" width="96" height="96" viewBox="0 0 64 64" fill="none" stroke="#111418" stroke-width="2" stroke-linejoin="round"><path d="{{p.icon}}"/></svg>
<span class="mono" style="position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #3E4650">[PHOTO]</span>
<sc-if value="{{p.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{p.img}}" alt="{{p.name}}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if>
<span class="mono" style="position: absolute; right: 12px; top: 12px; font-size: 11px; background: #fff; border: 1px solid #111418; padding: 4px 8px">{{p.code}}</span>
</a>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
<a href="{{p.url}}" style="font-weight: 800; font-size: 21px; line-height: 1.15">{{p.name}}</a>
<div class="mono" style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; text-transform: uppercase">
<span style="border: 1px solid #111418; padding: 4px 8px">{{p.matL}}</span>
<span style="border: 1px solid #111418; padding: 4px 8px">{{p.shore}}</span>
</div>
<div style="color: #3E4650; font-size: 15px; line-height: 1.5">{{p.spec}}</div>
<div style="margin-top: auto; padding-top: 14px; border-top: 1px solid #DDE1E5; display: flex; justify-content: space-between; align-items: center; gap: 10px">
<span class="mono" style="font-size: 12px; text-transform: uppercase; font-weight: 600">Price on request</span>
<button onClick="{{p.add}}" class="btn" style="{{p.btn}}">{{p.btnTxt}}</button>
</div>
</div>
</article>
</sc-for>
</div>
</div>
</div>
</section>

<section id="chizma" style="background: {{accent}}; border-top: 1px solid #111418; padding: 72px 0">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 520px">
<div class="mono" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em">[ Custom order ]</div>
<h2 style="margin: 0; font-weight: 800; font-size: 48px; line-height: 1.02; letter-spacing: -0.02em">Not in the catalog? We'll cast it to your drawing.</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="/en#chizma" class="btn" style="background: #111418; color: #fff; padding: 18px 28px; font-weight: 700; border: 1px solid #111418">Send a drawing →</a>
<a href="tel:+998000000000" class="btn mono" style="background: #fff; padding: 18px 24px; font-weight: 600; border: 1px solid #111418">+998 [__] ___-__-__</a>
</div>
</div>
</section>

<sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}">
<button onClick="{{openCart}}" class="btn" style="position: fixed; right: 24px; bottom: 24px; z-index: 45; background: #111418; color: #fff; border: 1px solid #111418; box-shadow: 6px 6px 0 {{accent}}; padding: 0 20px 0 0; min-height: 60px; display: flex; align-items: center; gap: 14px; font: 700 16px Archivo, sans-serif; cursor: pointer"><span style="width: 60px; height: 60px; background: {{accent}}; color: #111418; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">{{cartN}}</span>Request cart →</button>
</sc-if>
<sc-if value="{{cartOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; z-index: 60; background: rgba(17,20,24,0.35); display: flex; justify-content: flex-end">
<button onClick="{{closeCart}}" aria-label="Close" style="flex-grow: 1; background: transparent; border: 0; cursor: pointer"></button>
<div role="dialog" aria-label="Request cart" style="width: min(480px, 100%); background: #fff; border-left: 2px solid #111418; display: flex; flex-direction: column; overflow-y: auto; animation: irA .35s cubic-bezier(.2,.7,.2,1) both">
<div style="padding: 22px; border-bottom: 1px solid #111418; display: flex; justify-content: space-between; align-items: center"><span style="display: flex; flex-direction: column; gap: 4px"><span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Request cart</span><b style="font-size: 24px">{{cartN}} parts · {{cartTotal}} pcs</b></span><button onClick="{{closeCart}}" aria-label="Close cart" style="width: 40px; height: 40px; border: 1px solid #111418; background: #fff; font-size: 20px; cursor: pointer">×</button></div>
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 22px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start"><span style="width: 56px; height: 56px; background: #111418; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800">✓</span><b style="font-size: 26px">Request sent</b><span style="color: #3E4650; line-height: 1.6">A manager will prepare one quote for all parts and get back to you within [__] hours.</span><button onClick="{{closeCart}}" class="btn mono" style="background: #fff; border: 1px solid #111418; padding: 12px 16px; font: 600 13px 'JetBrains Mono', monospace; cursor: pointer">BACK TO CATALOG</button></div>
</sc-if>
<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{cartItems}}" as="c" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid #E3E7EB">
<span class="ph" style="width: 56px; height: 56px; border: 1px solid #111418; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 64 64" fill="none" stroke="#111418" stroke-width="2.4"><path d="{{c.icon}}"/></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span class="mono" style="font-size: 11px; color: #5B636D">{{c.code}}</span><b>{{c.name}}</b></span>
<span style="display: flex; border: 1px solid #111418"><button onClick="{{c.dec}}" aria-label="Decrease" style="width: 36px; height: 36px; border: 0; border-right: 1px solid #111418; background: #fff; cursor: pointer; font-size: 16px">−</button><span style="min-width: 40px; display: flex; align-items: center; justify-content: center; font-weight: 800">{{c.n}}</span><button onClick="{{c.inc}}" aria-label="Increase" style="width: 36px; height: 36px; border: 0; border-left: 1px solid #111418; background: #fff; cursor: pointer; font-size: 16px">+</button></span>
</div>
</sc-for>
</div>
<form onSubmit="{{sendCart}}" style="padding: 22px; display: flex; flex-direction: column; gap: 14px"><input type="hidden" data-lead="items" value="{{leadItems}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px">Company / name<input type="search" placeholder="Name" style="padding: 14px; font-size: 16px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px">Phone<input type="search" placeholder="+998" style="padding: 14px; font-size: 16px"></label>
<button type="submit" class="btn" style="background: #111418; color: #fff; border: 1px solid #111418; padding: 18px; font: 700 16px Archivo, sans-serif; cursor: pointer">Send one request →</button>
<span class="mono" style="font-size: 12px; color: #5B636D">Price on request. Get one quote for all parts.</span>
</form>
</sc-if>
</div>
</div>
