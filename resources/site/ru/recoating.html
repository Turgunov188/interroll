<style>
body{margin:0;background:#EEF0F2}
a{color:#111418;text-decoration:none}a:hover{color:#111418}
.mono{font-family:'JetBrains Mono',monospace}
.ph{background:repeating-linear-gradient(135deg,#E3E7EB 0 12px,#DCE0E4 12px 24px)}
@keyframes irIn{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.in{animation:irIn .9s cubic-bezier(.2,.7,.2,1) both}
.rv{transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.card{transition:transform .3s ease,box-shadow .3s ease}
.card:hover{transform:translate(-6px,-6px);box-shadow:6px 6px 0 #111418}
.btn{transition:transform .2s ease,box-shadow .2s ease}
.btn:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 #111418}
.anim{transition:all .9s cubic-bezier(.65,0,.35,1)}
.bar{transition:width 1s cubic-bezier(.2,.7,.2,1)}
input[type=range].ba{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
input[type=range].sl{width:100%;accent-color:#111418;height:28px;margin:0}
input[type=text],input[type=tel],input[type=number],textarea{font:400 16px Archivo,sans-serif;border:1px solid #111418;background:#fff;padding:14px 16px;color:#111418;width:100%;box-sizing:border-box;border-radius:0;transition:box-shadow .2s}
input:focus,textarea:focus{outline:none;box-shadow:4px 4px 0 #111418}
.faq summary{list-style:none;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq[open] .plus{transform:rotate(45deg)}
.plus{transition:transform .3s}
@media (prefers-reduced-motion: reduce){.in{animation:none}.rv,.anim,.bar{transition:none}}
</style>

.ir-nav a,.ir-more>button{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;white-space:nowrap}

.ir-more{position:relative}
.ir-more>button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;display:flex;align-items:center;gap:6px}
.ir-more>button svg{transition:transform .15s}

<body>
<div id="app"></div>
<template id="dc-template">

<div style="font-family: Archivo, sans-serif; color: #111418; position: relative; z-index: 0; --acc: {{accent}}">
<canvas data-mesh="1" aria-hidden="true" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: block"></canvas>

<header style="background: #fff; border-bottom: 1px solid #111418; position: sticky; top: 0; z-index: 40">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="/" style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#111418" stroke-width="2.5" style="{{logoSpin}}"><circle cx="17" cy="17" r="14"/><circle cx="17" cy="17" r="6"/><line x1="17" y1="3" x2="17" y2="11"/></svg>
<span style="font-weight: 800; font-size: 20px; letter-spacing: 0.03em">INTER ROLL</span>
</a>
<nav aria-label="Главное меню" class="mono ir-nav"><a href="/">Главная</a><a href="/catalog">Продукция</a><a href="/recoating" style="border-bottom-color: {{accent}}" aria-current="page">Восстановление</a><a href="/projects">Работы</a><a href="/blog">Блог</a><a href="/factory">Завод</a><a href="/contact">Контакты</a><div class="ir-more"><button type="button" aria-haspopup="true">Ещё<svg aria-hidden="true" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 1l4 4 4-4"/></svg></button><div class="ir-menu"><div><a href="/video">Видео</a><a href="/part-finder">Мастер подбора</a></div></div></div></nav>
<div class="mono" style="display: flex; align-items: center; gap: 16px; font-size: 14px">
<a href="/uz/recoating" hreflang="uz" lang="uz" style="color: #5B636D">UZ</a><a href="/recoating" hreflang="ru" lang="ru" style="font-weight: 600; border-bottom: 2px solid {{accent}}">RU</a><a href="/en/recoating" hreflang="en" lang="en" style="color: #5B636D">EN</a><a href="/tr/recoating" hreflang="tr" lang="tr" style="color: #5B636D">TR</a>
<a href="#ariza" class="btn" style="background: {{accent}}; padding: 13px 18px; font-weight: 600; text-transform: uppercase; border: 1px solid #111418">Оставить заявку</a>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; bottom: -1px; height: 3px; background: #111418; width: {{progress}}%"></div>
</header>

<section style="border-bottom: 1px solid #111418; background: radial-gradient(ellipse at 72% 40%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 60%)">
<div style="max-width: 1280px; margin: 0 auto; padding: 56px 24px 72px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div class="mono in" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #3E4650"><a href="/" style="color: #3E4650">Главная</a> / Услуги / Восстановление покрытия</div>
<h1 class="in" style="margin: 0; font-weight: 800; font-size: 74px; line-height: 0.95; letter-spacing: -0.035em; animation-delay: 80ms">Старый вал<br>не выбрасывайте.<br><span style="background: {{accent}}; padding: 0 8px">Восстановим.</span></h1>
<p class="in" style="margin: 0; font-size: 19px; line-height: 1.6; color: #3E4650; max-width: 540px; animation-delay: 180ms">Снимаем изношенное покрытие, восстанавливаем металлический сердечник и заливаем новый полиуретан или резину. Вал работает как новый — дешевле и быстрее, чем покупать новый.</p>
<div class="in" style="display: flex; flex-wrap: wrap; gap: 12px; animation-delay: 260ms">
<a href="#ariza" class="btn" style="background: #111418; color: #fff; border: 1px solid #111418; padding: 18px 28px; font-weight: 700">Отправить фото вала →</a>
<a href="#hisob" class="btn" style="background: #fff; border: 1px solid #111418; padding: 17px 28px; font-weight: 700">Расчёт экономии</a>
</div>
</div>

<figure class="in" style="flex: 1 1 520px; min-width: 0; margin: 0; background: #fff; border: 1px solid #111418; animation-delay: 200ms">
<div class="mono" style="display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #111418; font-size: 12px; text-transform: uppercase"><span>Процесс · живая схема</span><span>{{stageNo}} / 04</span></div>
<svg role="img" aria-label="{{stageLabel}}" viewBox="0 0 560 300" width="100%" style="display: block; background-image: linear-gradient(#EEF0F2 1px, transparent 1px), linear-gradient(90deg, #EEF0F2 1px, transparent 1px); background-size: 20px 20px">
<defs><pattern id="hq" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#D2D7DC"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8A939D" stroke-width="2"/></pattern></defs>
<line x1="20" y1="150" x2="540" y2="150" stroke="#111418" stroke-dasharray="14 4 2 4"/>
<rect x="40" y="136" width="480" height="28" fill="#4A535E" stroke="#111418" stroke-width="1.5"/>
<rect class="anim" x="{{hx}}" y="{{hy}}" width="{{hw}}" height="{{hh}}" fill="{{coatFill}}" fill-opacity="{{coatOp}}" stroke="#111418" stroke-width="2"/>
<rect x="100" y="112" width="360" height="76" fill="url(#hq)" stroke="#111418" stroke-width="1.5"/>
<g class="anim" style="{{wearOp}}" stroke="#111418" stroke-width="1.5" fill="none">
<path d="M130 90l14 8-6 10 M210 92l10 10 M300 88l8 12-10 6 M380 94l12 6 M170 206l10-8 M260 210l14-10 M350 206l8-8"/>
</g>
<g class="anim" style="{{pourOp}}">
<rect x="262" y="20" width="36" height="40" fill="#fff" stroke="#111418" stroke-width="1.5"/>
<rect class="anim" x="276" y="60" width="8" height="{{pourH}}" fill="{{accent}}" stroke="#111418"/>
</g>
<g class="anim" style="{{grindOp}}">
<rect x="{{gx}}" y="56" width="70" height="26" fill="#fff" stroke="#111418" stroke-width="1.5"/>
<circle cx="{{gcx}}" cy="82" r="12" fill="#D2D7DC" stroke="#111418" stroke-width="1.5"/>
</g>
<g font-family="JetBrains Mono, monospace" font-size="12" fill="#111418">
<text x="100" y="286">СЕРДЕЧНИК — ИСПОЛЬЗУЕТСЯ ПОВТОРНО</text>
<text x="460" y="286" text-anchor="end">{{coatTxt}}</text>
</g>
</svg>
<figcaption style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #111418">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.pick}}" style="{{s.style}}"><span class="mono" style="font-size: 11px">{{s.n}}</span><span style="font-weight: 700; font-size: 14px">{{s.t}}</span></button>
</sc-for>
</figcaption>
</figure>
</div>
</section>

<section id="hisob" data-rv="calc" style="padding: 96px 0; background: #111418; color: #EEF0F2">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: stretch">
<div class="rv" style="{{r.c0}}; flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<div class="mono" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: {{accent}}">[01] — Калькулятор экономии</div>
<h2 style="margin: 0; font-weight: 800; font-size: 46px; letter-spacing: -0.02em; line-height: 1.02">Рассчитайте вашу экономию</h2>
<label style="display: flex; flex-direction: column; gap: 8px">
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: #8A939D">Цена нового вала (1 шт.), сум</span>
<input type="number" min="0" step="100000" value="{{newPrice}}" onChange="{{setPrice}}" style="background: #1D2228; color: #fff; border-color: #5B636D; font-size: 22px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; justify-content: space-between"><span class="mono" style="font-size: 12px; text-transform: uppercase; color: #8A939D">Количество валов</span><b>{{qty}} шт.</b></span>
<input class="sl" type="range" min="1" max="50" value="{{qty}}" onChange="{{setQty}}" style="accent-color: {{accent}}">
</label>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; justify-content: space-between"><span class="mono" style="font-size: 12px; text-transform: uppercase; color: #8A939D">Цена восстановления относительно нового</span><b>{{ratio}}%</b></span>
<input class="sl" type="range" min="20" max="90" value="{{ratio}}" onChange="{{setRatio}}" style="accent-color: {{accent}}">
</label>
<span class="mono" style="font-size: 12px; color: #8A939D; line-height: 1.6">Ориентировочный расчёт. Точная цена зависит от состояния, размера и материала вала — пришлите фото, рассчитаем точно.</span>
</div>
<div class="rv" style="{{r.c1}}; flex: 1 1 460px; min-width: 0; background: #1D2228; border: 1px solid #3E4650; padding: 32px; display: flex; flex-direction: column; gap: 22px; justify-content: center">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="mono" style="display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; color: #8A939D"><span>Новые валы</span><span>{{newTotal}} сум</span></div>
<div style="height: 28px; background: #2A3038"><div class="bar" style="height: 28px; width: 100%; background: #5B636D"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="mono" style="display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; color: #8A939D"><span>Восстановление покрытия</span><span>{{recTotal}} сум</span></div>
<div style="height: 28px; background: #2A3038"><div class="bar" style="height: 28px; width: {{ratio}}%; background: {{accent}}"></div></div>
</div>
<div style="border-top: 1px dashed #5B636D; padding-top: 22px; display: flex; flex-direction: column; gap: 6px">
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: #8A939D">Ваша экономия</span>
<span style="font-weight: 800; font-size: 60px; line-height: 1; letter-spacing: -0.03em; color: {{accent}}">{{saveTotal}}</span>
<span class="mono" style="font-size: 13px">сум · {{saveRatio}}% дешевле</span>
</div>
<a href="#ariza" class="btn" style="background: {{accent}}; color: #111418; border: 1px solid #111418; padding: 18px; font-weight: 700; text-align: center">Узнать точную цену →</a>
</div>
</div>
</section>

<section data-rv="proc" style="padding: 96px 0; border-bottom: 1px solid #111418">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 32px">
<div class="rv" style="{{r.p0}}; display: flex; flex-direction: column; gap: 12px">
<div class="mono" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em">[02] — Как мы работаем</div>
<h2 style="margin: 0; font-weight: 800; font-size: 46px; letter-spacing: -0.02em; line-height: 1.02">С приёмки вала до возврата</h2>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border: 1px solid #111418; background: #fff">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<li class="rv" style="{{s.style}}">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 800; font-size: 40px; line-height: 1">{{s.n}}</span><span class="mono" style="font-size: 11px; color: #5B636D">{{s.time}}</span></span>
<span style="font-weight: 800; font-size: 18px; line-height: 1.2">{{s.t}}</span>
<span style="color: #3E4650; font-size: 14px; line-height: 1.5">{{s.d}}</span>
</li>
</sc-for>
</ol>
</div>
</section>

<section data-rv="mat" style="padding: 96px 0; background: rgba(255,255,255,0.78); border-bottom: 1px solid #111418">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 32px">
<div class="rv" style="{{r.m0}}; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="mono" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em">[03] — Материал покрытия</div>
<h2 style="margin: 0; font-weight: 800; font-size: 46px; letter-spacing: -0.02em; line-height: 1.02">Выберите материал под условия работы</h2>
</div>
<span class="mono" style="font-size: 12px; color: #5B636D; max-width: 320px">Общее сравнение. Инженер даст точную рекомендацию под ваши условия.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<sc-for list="{{mats}}" as="m" hint-placeholder-count="4">
<button onClick="{{m.pick}}" class="card rv" style="{{m.style}}">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 800; font-size: 26px">{{m.t}}</span><span class="mono" style="font-size: 12px; border: 1px solid #111418; padding: 4px 8px; background: #fff">{{m.sh}}</span></span>
<span style="color: #3E4650; line-height: 1.5; text-align: left">{{m.d}}</span>
<span style="display: flex; flex-direction: column; gap: 10px; width: 100%">
<sc-for list="{{m.props}}" as="p" hint-placeholder-count="4">
<span style="display: flex; flex-direction: column; gap: 4px"><span class="mono" style="display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase"><span>{{p.l}}</span><span>{{p.txt}}</span></span><span style="height: 6px; background: #E3E7EB; display: block"><span class="bar" style="{{p.bar}}"></span></span></span>
