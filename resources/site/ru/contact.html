<style>
body{margin:0;background:#EEF0F2}
a{color:#111418;text-decoration:none}a:hover{color:#111418}
.mono{font-family:'JetBrains Mono',monospace}
@keyframes irIn{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes irPulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@keyframes irDash{to{stroke-dashoffset:-40}}
@keyframes irPop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:none}}
.in{animation:irIn .9s cubic-bezier(.2,.7,.2,1) both}
.ring{animation:irPulse 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
.route{stroke-dasharray:8 8;animation:irDash 1.6s linear infinite}
.pop{animation:irPop .5s cubic-bezier(.2,.7,.2,1) both}
.card{transition:transform .3s ease,box-shadow .3s ease}
.card:hover{transform:translate(-6px,-6px);box-shadow:6px 6px 0 #111418}
.btn{transition:transform .2s ease,box-shadow .2s ease}
.btn:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 #111418}
input[type=text],input[type=tel],textarea{font:400 16px Archivo,sans-serif;border:1px solid #111418;background:#fff;padding:14px 16px;color:#111418;width:100%;box-sizing:border-box;border-radius:0;transition:box-shadow .2s}
input:focus,textarea:focus{outline:none;box-shadow:4px 4px 0 #111418}
@media (prefers-reduced-motion: reduce){.in,.ring,.route,.pop{animation:none}}
</style>

<style>.ir-nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;font-size:13px;text-transform:uppercase}
.ir-nav a,.ir-more>button{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;white-space:nowrap}
.ir-nav a:hover,.ir-more>button:hover{border-bottom-color:#111418}
.ir-more{position:relative}
.ir-more>button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;display:flex;align-items:center;gap:6px}
.ir-more>button svg{transition:transform .15s}
.ir-more:hover>button svg,.ir-more:focus-within>button svg{transform:rotate(180deg)}
.ir-menu{display:none;position:absolute;right:0;top:100%;padding-top:10px;z-index:50}
.ir-menu>div{background:#fff;border:1px solid #111418;box-shadow:4px 4px 0 #111418;min-width:240px;display:flex;flex-direction:column}
.ir-menu a{padding:12px 16px;border-bottom:1px solid #E3E6EA}
.ir-menu a:last-child{border-bottom:0}
.ir-menu a:hover{background:#F2F3F5;border-bottom-color:#E3E6EA}
.ir-more:hover .ir-menu,.ir-more:focus-within .ir-menu{display:block}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">

<div style="font-family: Archivo, sans-serif; color: #111418; position: relative; z-index: 0; --acc: {{accent}}">
<canvas data-mesh="1" aria-hidden="true" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: block"></canvas>

<header style="background: #fff; border-bottom: 1px solid #111418; position: sticky; top: 0; z-index: 40">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="/" style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#111418" stroke-width="2.5" style="{{logoSpin}}"><circle cx="17" cy="17" r="14"/><circle cx="17" cy="17" r="6"/><line x1="17" y1="3" x2="17" y2="11"/></svg>
<span style="font-weight: 800; font-size: 20px; letter-spacing: 0.03em">INTER ROLL</span>
</a>
<nav aria-label="Главное меню" class="mono ir-nav"><a href="/">Главная</a><a href="/catalog">Продукция</a><a href="/recoating">Восстановление</a><a href="/projects">Работы</a><a href="/blog">Блог</a><a href="/factory">Завод</a><a href="/contact" style="border-bottom-color: {{accent}}" aria-current="page">Контакты</a><div class="ir-more"><button type="button" aria-haspopup="true">Ещё<svg aria-hidden="true" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 1l4 4 4-4"/></svg></button><div class="ir-menu"><div><a href="/video">Видео</a><a href="/part-finder">Мастер подбора</a></div></div></div></nav>
<div class="mono" style="display: flex; align-items: center; gap: 16px; font-size: 14px">
<a href="/uz/contact" hreflang="uz" lang="uz" style="color: #5B636D">UZ</a><a href="/contact" hreflang="ru" lang="ru" style="font-weight: 600; border-bottom: 2px solid {{accent}}">RU</a><a href="/en/contact" hreflang="en" lang="en" style="color: #5B636D">EN</a><a href="/tr/contact" hreflang="tr" lang="tr" style="color: #5B636D">TR</a>
<a href="#forma" class="btn" style="background: {{accent}}; padding: 13px 18px; font-weight: 600; text-transform: uppercase; border: 1px solid #111418">Оставить заявку</a>
</div>
</div>
</header>

<section style="border-bottom: 1px solid #111418; background: radial-gradient(ellipse at 70% 10%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 60%)">
<div style="max-width: 1280px; margin: 0 auto; padding: 56px 24px 56px; display: flex; flex-direction: column; gap: 36px">
<div class="mono in" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #3E4650"><a href="/" style="color: #3E4650">Главная</a> / Контакты</div>
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between">
<h1 class="in" style="margin: 0; font-weight: 800; font-size: 80px; line-height: 0.93; letter-spacing: -0.035em; animation-delay: 80ms">Свяжитесь —<br><span style="background: {{accent}}; padding: 0 8px">отвечает инженер</span></h1>
<div class="in" style="background: #fff; border: 1px solid #111418; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 280px; animation-delay: 200ms">
<div class="mono" style="display: flex; align-items: center; gap: 10px; font-size: 13px; text-transform: uppercase; font-weight: 600"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: {{openDot}}"></span>{{openTitle}}</div>
<div class="mono" style="font-size: 13px; color: #3E4650">{{openSub}}</div>
<div class="mono" style="font-size: 12px; color: #5B636D">Время в Ташкенте: {{clock}}</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<sc-for list="{{channels}}" as="c" hint-placeholder-count="4">
<div class="card in" style="{{c.style}}">
<span style="display: flex; justify-content: space-between; align-items: flex-start">
<span style="width: 52px; height: 52px; border: 1px solid #111418; background: {{c.bg}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.ic}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.icon}}"/></svg></span>
<span class="mono" style="font-size: 11px; color: #5B636D; text-transform: uppercase">{{c.tag}}</span>
</span>
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">{{c.k}}</span>
<a href="{{c.href}}" style="font-weight: 800; font-size: 24px; line-height: 1.15; word-break: break-word">{{c.v}}</a>
<span style="color: #3E4650; font-size: 14px; line-height: 1.5">{{c.d}}</span>
<span style="display: flex; gap: 8px; margin-top: auto">
<a href="{{c.href}}" class="btn mono" style="flex: 1; text-align: center; background: #111418; color: #fff; border: 1px solid #111418; padding: 12px; font-size: 13px; font-weight: 600; text-transform: uppercase">{{c.act}}</a>
<button onClick="{{c.copy}}" class="btn mono" aria-label="{{c.copyLabel}}" style="min-width: 96px; background: #fff; border: 1px solid #111418; padding: 12px; font: 600 12px 'JetBrains Mono', monospace; text-transform: uppercase; cursor: pointer">{{c.copyTxt}}</button>
</span>
</div>
</sc-for>
</div>
</div>
</section>

<section style="padding: 80px 0; background: rgba(255,255,255,0.78); border-bottom: 1px solid #111418">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
<div style="flex: 2 1 640px; min-width: 0; background: #fff; border: 1px solid #111418; display: flex; flex-direction: column">
<div class="mono" style="display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #111418; font-size: 12px; text-transform: uppercase"><span>Как добраться · схема</span><span>__S_city_district__</span></div>
<svg role="img" aria-label="Схема проезда к заводу" viewBox="0 0 720 400" width="100%" style="display: block; background: #F4F5F7">
<g stroke="#DDE1E5" stroke-width="1">
<path d="M0 40h720M0 80h720M0 120h720M0 160h720M0 200h720M0 240h720M0 280h720M0 320h720M0 360h720"/>
<path d="M40 0v400M80 0v400M120 0v400M160 0v400M200 0v400M240 0v400M280 0v400M320 0v400M360 0v400M400 0v400M440 0v400M480 0v400M520 0v400M560 0v400M600 0v400M640 0v400M680 0v400"/>
</g>
<path d="M0 300 C160 290 260 250 380 250 S600 230 720 210" stroke="#C9CED4" stroke-width="26" fill="none"/>
<path d="M0 300 C160 290 260 250 380 250 S600 230 720 210" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="14 10"/>
<path d="M440 0 L470 400" stroke="#C9CED4" stroke-width="18" fill="none"/>
<path d="M120 0 C140 120 180 200 300 250" stroke="#D6DADF" stroke-width="12" fill="none"/>
<rect x="500" y="80" width="120" height="70" fill="#E3E7EB" stroke="#B9C0C8"/>
<rect x="250" y="70" width="140" height="80" fill="#E3E7EB" stroke="#B9C0C8"/>
<rect x="80" y="320" width="160" height="60" fill="#E3E7EB" stroke="#B9C0C8"/>
<path class="route" d="M60 296 C160 290 260 252 380 252 S455 240 458 200 L462 150" stroke="#111418" stroke-width="3" fill="none"/>
<rect x="430" y="96" width="70" height="52" fill="{{accent}}" stroke="#111418" stroke-width="2"/>
<circle class="ring" cx="465" cy="122" r="10" fill="{{accent}}"/>
<circle cx="465" cy="122" r="7" fill="#111418"/>
<g font-family="JetBrains Mono, monospace" font-size="12" fill="#111418">
<text x="512" y="70">ЗАВОД INTER ROLL</text>
<text x="512" y="86" fill="#5B636D">__S_street__</text>
<text x="14" y="288">__S_main_road__</text>
<text x="476" y="390">__S_side_street__</text>
<text x="16" y="312" fill="#5B636D">● __S_transit_stop__</text>
</g>
</svg>
<div style="display: flex; flex-wrap: wrap; border-top: 1px solid #111418">
<a href="__S_map_yandex__" target="_blank" rel="noopener" class="mono" style="flex: 1 1 200px; padding: 16px; border-right: 1px solid #111418; font-size: 13px; font-weight: 600; text-transform: uppercase">Открыть в Яндекс Картах ↗</a>
<a href="__S_map_google__" target="_blank" rel="noopener" class="mono" style="flex: 1 1 200px; padding: 16px; border-right: 1px solid #111418; font-size: 13px; font-weight: 600; text-transform: uppercase">Google Maps ↗</a>
<a href="__S_map_route__" target="_blank" rel="noopener" class="mono" style="flex: 1 1 200px; padding: 16px; font-size: 13px; font-weight: 600; text-transform: uppercase">Поехать с Yandex Go ↗</a>
</div>
</div>
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #111418; color: #EEF0F2; border: 1px solid #111418; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: {{accent}}">Адрес</span>
<span style="font-weight: 800; font-size: 24px; line-height: 1.2">__S_address__</span>
<span class="mono" style="font-size: 13px; color: #A9B0B8; line-height: 1.6">Ориентир: __S_landmark__<br>Въезд для грузовиков: __S_truck_gate__</span>
</div>
<div style="background: #fff; border: 1px solid #111418; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Режим работы</span>
<sc-for list="{{hours}}" as="h" hint-placeholder-count="3">
<span style="{{h.style}}"><span>{{h.d}}</span><span class="mono">{{h.t}}</span></span>
</sc-for>
</div>
<div style="background: #fff; border: 1px solid #111418; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<span class="mono" style="font-size: 12px; text-transform: uppercase; color: #5B636D">Как добраться</span>
<span style="line-height: 1.6">Общественный транспорт: <b>__S_transit_stop__</b>, __S_walk_minutes__ минут пешком.<br>На автомобиле: __S_landmark__, бесплатная парковка __S_parking__.</span>
</div>
</div>
</div>
</section>

<section style="padding: 80px 0; border-bottom: 1px solid #111418">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="mono" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em">[ Отделы ]</div>
<h2 style="margin: 0; font-weight: 800; font-size: 44px; letter-spacing: -0.02em; line-height: 1.02">Напрямую нужному специалисту</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="3">
<div class="card" style="background: #fff; border: 1px solid #111418; display: flex; flex-direction: column">
<div style="display: flex; gap: 16px; align-items: center; padding: 22px; border-bottom: 1px solid #DDE1E5">
<span style="width: 64px; height: 64px; border: 1px solid #111418; background: repeating-linear-gradient(135deg,#E3E7EB 0 8px,#DCE0E4 8px 16px); flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 19px">{{p.name}}</b><span class="mono" style="font-size: 12px; color: #5B636D; text-transform: uppercase">{{p.role}}</span></span>
</div>
<div style="padding: 22px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
<span style="color: #3E4650; line-height: 1.5">{{p.d}}</span>
<a href="{{p.href}}" class="mono" style="font-weight: 600; font-size: 15px">{{p.tel}}</a>
<span class="mono" style="font-size: 12px; color: #5B636D">Языки: {{p.lang}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</section>

<section id="forma" style="background: {{accent}}; border-bottom: 1px solid #111418; padding: 88px 0">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div class="mono" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em">[ Заявка ]</div>
<h2 style="margin: 0; font-weight: 800; font-size: 52px; line-height: 0.98; letter-spacing: -0.03em">Напишите ваш вопрос</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6">Заявка попадает напрямую в нужный отдел. В рабочее время отвечаем в течение __S_reply_minutes__ минут.</p>
<div class="mono" style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; border-top: 1px dashed #111418; padding-top: 16px">
<span>✓ Ваши данные не передаются третьим лицам</span>
<span>✓ Без спама — только по вашему запросу</span>
</div>
</div>
<div style="flex: 1 1 540px; min-width: 0">
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div class="pop" style="background: #fff; border: 1px solid #111418; padding: 48px 36px; box-shadow: 10px 10px 0 #111418; display: flex; flex-direction: column; gap: 16px; align-items: flex-start">
<span style="width: 64px; height: 64px; background: #111418; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800">✓</span>
<span style="font-weight: 800; font-size: 32px; line-height: 1.1">Заявка принята</span>
<span style="color: #3E4650; line-height: 1.6">Тема: <b>{{topicName}}</b>. {{replyBy}} — свяжемся этим способом. Номер заявки: <span class="mono">{{leadNo}}</span></span>
<button onClick="{{again}}" class="btn mono" style="background: #fff; border: 1px solid #111418; padding: 12px 18px; font: 600 13px 'JetBrains Mono', monospace; text-transform: uppercase; cursor: pointer">Отправить ещё заявку</button>
</div>
</sc-if>
<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">

<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { now: null, copied: '', topic: 'narx', reply: 'tel', sent: false }; }
  startMesh() {
    const cv = document.querySelector('canvas[data-mesh]');
    if (!cv || !cv.getContext) return;
    const ctx = cv.getContext('2d');
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const gap = 38, R = 170;
    let W = 0, H = 0, nodes = [], cols = 0, rows = 0;
    const m = { x: -9999, y: -9999, px: -9999, py: -9999, vx: 0, vy: 0, on: false };
    const build = () => {
      cols = Math.ceil(W / gap) + 3; rows = Math.ceil(H / gap) + 3; nodes = [];
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const rx = (i - 1) * gap, ry = (j - 1) * gap;
        nodes.push({ rx, ry, x: rx, y: ry, vx: 0, vy: 0 });
      }
    };
    const resize = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build();
    };
    const hex = (h) => { const s = String(h || '#F5B700').replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [parseInt(f.slice(0, 2), 16) || 245, parseInt(f.slice(2, 4), 16) || 183, parseInt(f.slice(4, 6), 16) || 0]; };
    const impulse = (cx, cy, rad, power) => {
      for (const n of nodes) {
        const dx = n.x - cx, dy = n.y - cy, d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < rad) { const f = 1 - d / rad; n.vx += (dx / d) * f * power; n.vy += (dy / d) * f * power; }
      }
    };
    this.onMoveMesh = (e) => { m.x = e.clientX; m.y = e.clientY; m.on = true; };
    this.onLeaveMesh = () => { m.on = false; };
    this.onDownMesh = (e) => impulse(e.clientX, e.clientY, 300, 14);
    let lastY = window.scrollY || 0;
    this.onScrollMesh = () => {
      const y = window.scrollY || 0, d = Math.max(-60, Math.min(60, y - lastY)); lastY = y;
      for (let k = 0; k < nodes.length; k++) nodes[k].vy -= d * 0.06 * (0.6 + 0.4 * Math.sin(nodes[k].rx * 0.01));
    };
